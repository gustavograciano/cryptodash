events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream cryptodash_api { server api:8080; }
    upstream cryptodash_web { server frontend:80; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name cryptodash.local;

        ssl_certificate     /etc/letsencrypt/live/cryptodash.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cryptodash.local/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 2m;

        location /api/ {
            proxy_pass http://cryptodash_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://cryptodash_web;
            proxy_set_header Host $host;
        }
    }
}
